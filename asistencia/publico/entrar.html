<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asistencia docente · Acceso</title>
<link rel="stylesheet" href="/estilo.css">
<style>
  body { background: var(--tinta); display: grid; place-items: center; min-height: 100dvh; padding: 24px; }
  .caja { width: 100%; max-width: 360px; background: var(--papel-claro); border-radius: 3px; padding: 28px 24px 24px; border-top: 5px solid var(--sello); }
  .marca { text-align: center; margin-bottom: 26px; }
  .marca .anillo {
    width: 74px; height: 74px; margin: 0 auto 14px; border: 2px solid var(--sello); border-radius: 50%;
    display: grid; place-items: center; color: var(--sello); font-family: var(--mono); font-weight: 600;
    font-size: .58rem; letter-spacing: .1em; line-height: 1.3; text-align: center; transform: rotate(-6deg);
  }
</style>
</head>
<body>
  <main class="caja">
    <div class="marca">
      <div class="anillo">REGISTRO<br>DOCENTE</div>
      <h1>Asistencia docente</h1>
      <p class="rotulo" style="margin-top:6px">Control de entrada por código QR</p>
    </div>
    <label>
      <span class="rotulo">Clave de acceso</span>
      <input id="clave" type="password" autocomplete="current-password" placeholder="••••••••">
    </label>
    <button id="btn" style="width:100%">Entrar</button>
    <p id="msg" class="error" style="margin-top:12px"></p>
    <p class="aviso" style="margin-top:18px">La dirección ve el panel completo. La estación de entrada solo abre la cámara para escanear.</p>
  </main>
<script>
  const clave = document.getElementById('clave');
  const msg = document.getElementById('msg');
  async function entrar() {
    msg.textContent = '';
    const r = await fetch('/api/entrar', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ clave: clave.value })
    });
    const d = await r.json();
    if (!d.ok) { msg.textContent = d.motivo || 'No se pudo entrar'; return; }
    location.href = d.rol === 'direccion' ? '/panel' : '/escaner';
  }
  document.getElementById('btn').onclick = entrar;
  clave.addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
</script>
</body>
</html>
